name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # needed for OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.167.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site and theme
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo extended
        run: |
          wget -q -O /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install Dart Sass (the theme needs it)
        run: sudo snap install dart-sass

      - name: Install Node dependencies if the site has any
        run: if [ -f package-lock.json ]; then npm ci; fi

      - name: Build
        run: hugo --gc --minify

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync public/ "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Clear the CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
